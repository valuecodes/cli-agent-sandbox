name: Maintenance dashboard

on:
  schedule:
    # Daily. An off-peak minute avoids the top-of-the-hour queue.
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  # Keeps one issue listing due catalog, pnpm, gitleaks, Node.js and audit
  # updates. It never changes code. A called workflow cannot raise the caller's
  # token, so the job grants it here. Pins the same `valuecodes/automation`
  # commit as workflow-lint in `checks.yml`; bump them together.
  maintenance-dashboard:
    permissions:
      contents: read
      issues: write
    uses: valuecodes/automation/.github/workflows/maintenance-dashboard.yml@579e387a41ea0604a149567f4f90d6ad6408313c # v0.5.0
