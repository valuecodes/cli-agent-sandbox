name: Checks

# Every check, defined once. `feature.yml` (PRs) and `main.yml` (push to main)
# call it; a called workflow cannot raise the caller's token, so each caller job
# grants the permissions the jobs below ask for.
on:
  workflow_call:

permissions: {}

jobs:
  check:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Root package.json script names.
        task: [typecheck, lint, knip, "format:check", test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      # zizmor prefers the `$/` self-repository syntax, but actionlint 1.7.12
      # rejects it; switch once actionlint accepts `$/`.
      - name: Setup
        uses: ./.github/actions/setup # zizmor: ignore[self-repository]

      # The task name goes through `env`, never straight into `run`.
      - name: Run ${{ matrix.task }}
        env:
          TASK: ${{ matrix.task }}
        run: pnpm "$TASK"

  # gitleaks over the full git history, at the version pinned in the reusable
  # workflow. It reads `.gitleaks.toml` here if one is added.
  secret-scan:
    permissions:
      contents: read
    uses: valuecodes/maintain-kit/.github/workflows/secret-scan.yml@e5bf1d24a413d9312cd2051c39ef44ddd9358be5 # v1.0.0

  # actionlint (with shellcheck on `run:` scripts) and zizmor over the workflow
  # and action files.
  workflow-lint:
    permissions:
      contents: read
    uses: valuecodes/maintain-kit/.github/workflows/workflow-lint.yml@e5bf1d24a413d9312cd2051c39ef44ddd9358be5 # v1.0.0
